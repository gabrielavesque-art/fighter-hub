name: Données Fighter Hub

on:
  workflow_dispatch:
    inputs:
      tache:
        description: "Quoi générer"
        required: true
        default: elo
        type: choice
        options:
          - elo
          - stats
          - photos-test
          - photos-complet
          - photos-retry
          - photos-rebuild
          - descriptions-test
          - descriptions-complet
          - descriptions-retry
          - descriptions-rebuild
          - videos-test
          - videos
          - videos-rebuild
          - events-selftest
          - events
          - events-dump

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Générer
        run: |
          case "${{ inputs.tache }}" in
            elo)            node build-elo.js ;;
            stats)          node build-stats.js ;;
            photos-test)    node resolve-photos.js --test ;;
            photos-complet) node resolve-photos.js ;;
            photos-retry)   node resolve-photos.js --retry ;;
            photos-rebuild) node resolve-photos.js --force ;;
            descriptions-test)    node build-descriptions.js --test ;;
            descriptions-complet) node build-descriptions.js ;;
            descriptions-retry)   node build-descriptions.js --retry ;;
            descriptions-rebuild) node build-descriptions.js --force ;;
            videos-test)    node build-videos.js --test ;;
            videos)         node build-videos.js ;;
            videos-rebuild) node build-videos.js --force ;;
            events-selftest) node build-events.js --selftest ;;
            events)         node build-events.js ;;
            events-dump)    node build-events.js --dump ;;
          esac
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Committer le résultat
        if: inputs.tache != 'photos-test' && inputs.tache != 'descriptions-test' && inputs.tache != 'videos-test' && inputs.tache != 'events-selftest' && inputs.tache != 'events-dump'
        run: |
          if [ -n "$(git status --porcelain '*.json')" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add photos.json stats.json elo.json descriptions.json videos.json events.json 2>/dev/null || true
            git commit -m "Mise à jour des données (${{ inputs.tache }})"
            git push
          else
            echo "Aucun fichier modifié."
          fi
