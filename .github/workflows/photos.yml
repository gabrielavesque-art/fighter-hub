name: Données Fighter Hub

on:
  workflow_dispatch:
    inputs:
      tache:
        description: "Quoi générer"
        required: true
        default: stats
        type: choice
        options:
          - stats
          - photos-test
          - photos-complet
          - photos-retry

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Générer
        run: |
          case "${{ inputs.tache }}" in
            stats)          node build-stats.js ;;
            photos-test)    node resolve-photos.js --test ;;
            photos-complet) node resolve-photos.js ;;
            photos-retry)   node resolve-photos.js --retry ;;
          esac

      - name: Committer le résultat
        if: inputs.tache != 'photos-test'
        run: |
          if [ -n "$(git status --porcelain '*.json')" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add photos.json stats.json 2>/dev/null || true
            git commit -m "Mise à jour des données (${{ inputs.tache }})"
            git push
          else
            echo "Aucun fichier modifié."
          fi
