name: Données Fighter Hub

on:
  # Les cartes UFC s'annoncent en continu : deux passages par jour suffisent à
  # ce que le site suive sans qu'on y pense. Les autres tâches restent
  # manuelles — elles sont longues et n'ont pas besoin d'être régulières.
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 17 * * *'
  workflow_dispatch:
    inputs:
      tache:
        description: "Quoi générer"
        required: true
        default: elo
        type: choice
        options:
          - elo
          - stats
          - photos-test
          - photos-complet
          - photos-retry
          - photos-rebuild
          - descriptions-test
          - descriptions-complet
          - descriptions-retry
          - descriptions-rebuild
          - videos-test
          - videos
          - videos-rebuild
          - events-selftest
          - events
          - events-dump

permissions:
  contents: write

# un déclenchement planifié ne fournit aucune entrée : on retombe sur « events »
env:
  TACHE: ${{ inputs.tache || 'events' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Générer
        run: |
          case "$TACHE" in
            elo)            node build-elo.js ;;
            stats)          node build-stats.js ;;
            photos-test)    node resolve-photos.js --test ;;
            photos-complet) node resolve-photos.js ;;
            photos-retry)   node resolve-photos.js --retry ;;
            photos-rebuild) node resolve-photos.js --force ;;
            descriptions-test)    node build-descriptions.js --test ;;
            descriptions-complet) node build-descriptions.js ;;
            descriptions-retry)   node build-descriptions.js --retry ;;
            descriptions-rebuild) node build-descriptions.js --force ;;
            videos-test)    node build-videos.js --test ;;
            videos)         node build-videos.js ;;
            videos-rebuild) node build-videos.js --force ;;
            events-selftest) node build-events.js --selftest ;;
            events)         node build-events.js ;;
            events-dump)    node build-events.js --dump ;;
          esac
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Committer le résultat
        if: ${{ !contains(fromJSON('["photos-test","descriptions-test","videos-test","events-selftest","events-dump"]'), env.TACHE) }}
        run: |
          if [ -n "$(git status --porcelain '*.json')" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add photos.json stats.json elo.json descriptions.json videos.json events.json 2>/dev/null || true
            git commit -m "Mise à jour des données ($TACHE)"
            git push
          else
            echo "Aucun fichier modifié."
          fi
